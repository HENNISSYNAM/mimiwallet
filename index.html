<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Google hiện biểu tượng cạnh kết quả tìm kiếm: cần ảnh vuông, cạnh là bội số của 48px, ở đúng tên miền. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/mimi-cat-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Cho cài MIMI vào màn hình chính / thành cửa sổ riêng. Xem HopTaiUngDung.tsx. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F97316" />
    <!-- viewport-fit=cover bắt buộc, nếu không env(safe-area-inset-*) luôn trả 0
         trên iOS và các tiện ích .safe-top/.safe-bottom trong index.css sẽ tồn
         tại mà không có tác dụng gì. Không đặt maximum-scale/user-scalable=no:
         chặn phóng to là lỗi tiếp cận, và App Store lẫn WCAG đều tính đó là lỗi. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MIMI Wallet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google-site-verification" content="6AcHtCP61UUqEwxh8RCiYgosieNOgApHb2UzLALfiLQ" />
    <!-- Thẻ mặc định cho trình thu thập không chạy JS. Phải khớp với tiêu đề
         trang chủ trong App.tsx: bản cũ ghi "Ví xanh cho tương lai bền vững" —
         một câu từ định hướng đã bỏ, không nói đúng sản phẩm, và là thứ hiện ra
         khi dán link lên Zalo hay Facebook. -->
    <title>MIMI WALLET — Kiểm soát chi tiêu cho doanh nghiệp chạy bằng AI</title>
    <meta name="description" content="MIMI Wallet đọc sao kê ngân hàng của doanh nghiệp, dựng sẵn bộ chứng từ chi phí và đối soát công nợ — để bạn đóng thuế trên lợi nhuận thay vì trên doanh thu." />
    <meta property="og:title" content="MIMI WALLET — Kiểm soát chi tiêu cho doanh nghiệp chạy bằng AI" />
    <meta property="og:description" content="Đọc sao kê ngân hàng, dựng bộ chứng từ chi phí, đối soát công nợ. Dành cho doanh nghiệp và hộ kinh doanh Việt Nam." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MIMI Wallet" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://www.mimiwallet.online/" />
    <meta property="og:image" content="https://www.mimiwallet.online/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mèo MIMI, linh vật của MIMI Wallet" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mimiwallet.online/og-image.jpg" />
    <link rel="canonical" href="https://www.mimiwallet.online/" />
    <!-- Dữ liệu có cấu trúc: Google dùng `logo` của Organization cho bảng tri thức, và WebSite cho tên trang trong
         kết quả. Thẻ ld+json là dữ liệu, không chạy như mã, nên CSP `script-src 'self'` không chặn. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.mimiwallet.online/#to-chuc",
          "name": "MIMI Wallet",
          "legalName": "Công ty Cổ phần CLI Nutrix",
          "url": "https://www.mimiwallet.online/",
          "logo": "https://www.mimiwallet.online/mimi-cat-512.png",
          "taxID": "0319436143",
          "email": "hoc.qk2@gmail.com",
          "address": { "@type": "PostalAddress", "streetAddress": "829 Huỳnh Tấn Phát, Phường Phú Thuận", "addressLocality": "Thành phố Hồ Chí Minh", "addressCountry": "VN" },
          "sameAs": ["https://www.facebook.com/profile.php?id=61593186898315"]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.mimiwallet.online/#web",
          "name": "MIMI Wallet",
          "alternateName": "MIMI",
          "url": "https://www.mimiwallet.online/",
          "inLanguage": "vi",
          "publisher": { "@id": "https://www.mimiwallet.online/#to-chuc" }
        }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      #root starts with a boot screen instead of being empty. React's render()
      replaces these children on mount, so it is invisible in the happy path.
      If the bundle throws at import time (a stale cached build, a missing env
      var) React never mounts and this stays on screen — a readable message
      instead of a blank white page.
    -->
    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,-apple-system,sans-serif;background:#FDF8F3;color:#1c1c1e">
        <div style="max-width:320px;width:100%;text-align:center">
          <div id="boot-spinner" style="width:36px;height:36px;margin:0 auto;border:3px solid rgba(0,0,0,.1);border-top-color:#F97316;border-radius:50%;animation:boot-spin .8s linear infinite"></div>
          <div id="boot-failed" style="display:none">
            <div style="font-size:28px;margin-bottom:12px">🔄</div>
            <h1 style="font-size:17px;font-weight:700;margin:0">Ứng dụng cần tải lại</h1>
            <p style="font-size:14px;line-height:1.5;color:#6b6b70;margin:8px 0 20px">
              Trình duyệt có thể đang giữ phiên bản cũ. Nhấn nút bên dưới để tải bản mới nhất.
            </p>
            <button id="boot-reload" type="button"
                    style="width:100%;height:48px;border:0;border-radius:16px;background:#F97316;color:#fff;font-size:15px;font-weight:600;cursor:pointer">
              Tải lại ứng dụng
            </button>
          </div>
        </div>
      </div>
    </div>
    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
