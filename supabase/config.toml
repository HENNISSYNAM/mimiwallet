project_id = "xzymxgdavepvygdcmfup"

# SePay posts here with a shared key in the Authorization header, not a user
# JWT, so the platform's JWT gate has to be off for this one function. The
# function authenticates the caller itself with a constant-time key comparison.
[functions.bank-webhook]
verify_jwt = false

# Casso's webhook form offers no signing secret, so this endpoint carries a
# shared key in its URL and — more importantly — verifies every claim against
# the Cas API before changing anything. See the header of the function.
[functions.cas-webhook]
verify_jwt = false
