project_id = "xzymxgdavepvygdcmfup"

# SePay posts here with a shared key in the Authorization header, not a user
# JWT, so the platform's JWT gate has to be off for this one function. The
# function authenticates the caller itself with a constant-time key comparison.
[functions.bank-webhook]
verify_jwt = false

# Casso's webhook form offers no signing secret, so this endpoint carries a
# shared key in its URL and — more importantly — verifies every claim against
# the Cas API before changing anything. See the header of the function.
[functions.cas-webhook]
verify_jwt = false

# Agents call this with their own key in the x-mimi-agent-key header, not a user
# JWT. The function checks that key (SHA-256 lookup) itself, and for the owner's
# actions it verifies the user JWT itself with auth.getUser.
[functions.tac-tu]
verify_jwt = false

# MCP server for AI clients (Claude Code, Cursor…). Same agent key, same checks
# as tac-tu — the handler is shared in _shared/tac-tu/cong-tac-tu.ts.
[functions.mcp]
verify_jwt = false

# Temporary loader for the legal corpus. Authenticated by the NAP_KHO_TOKEN
# secret (constant-time compare); returns 503 when that secret is unset.
[functions.nap-kho-luat]
verify_jwt = false
